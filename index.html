```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탄막 게임 - 0.3.2</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
        }

        #gameContainer {
            position: relative;
        }

        canvas {
            background-color: #0d0d0d;
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #startButton {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;

            color: white;
            background-color: #6a00ff;
            border: 2px solid #d8b4fe;
            border-radius: 8px;

            cursor: pointer;
        }

        #startButton:hover {
            background-color: #8500ff;
        }
    </style>
</head>

<body>

<div id="gameContainer">

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <button id="startButton">START</button>

</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startButton = document.getElementById("startButton");

    let player = {
        x: 200,
        y: 450,
        radius: 8,
        speed: 5
    };

    let bullets = [];
    let scorePopups = [];
    let score = 0;

    let isGameOver = false;
    let isGameStarted = false;

    let keys = {};

    let parry = {
        active: false,
        cooldown: false,
        rewarded: false,
        radius: 25,
        duration: 10,
        cooldownTime: 70,
        timer: 0,
        cdTimer: 0,
        combo: 0,
        comboTimer: 0,
        maxComboTimer: 210
    };


    // =========================
    // 키 입력
    // =========================

    window.addEventListener("keydown", function (e) {

        keys[e.key] = true;

        // 게임 오버 상태에서 스페이스바를 누르면 재시작
        if (isGameOver && e.key === " ") {
            resetGame();
        }

        // Shift 또는 Z로 패링
        if (
            (e.key === "Shift" || e.key === "z" || e.key === "Z") &&
            !parry.cooldown &&
            !isGameOver &&
            isGameStarted
        ) {
            activateParry();
        }
    });


    window.addEventListener("keyup", function (e) {
        keys[e.key] = false;
    });


    // =========================
    // START 버튼
    // =========================

    startButton.addEventListener("click", function () {

        isGameStarted = true;
        isGameOver = false;

        startButton.style.display = "none";

        resetGame();

    });


    // =========================
    // 패링 활성화
    // =========================

    function activateParry() {

        parry.active = true;
        parry.cooldown = true;
        parry.rewarded = false;

        parry.timer = parry.duration;
        parry.cdTimer = parry.cooldownTime;
    }


    // =========================
    // 탄막 생성
    // =========================

    function spawnBullet() {

        if (!isGameStarted || isGameOver) return;

        bullets.push({
            x: Math.random() * canvas.width,
            y: 0,
            radius: 4,
            speed: 3 + Math.random() * 4
        });
    }


    // =========================
    // 게임 재시작
    // =========================

    function resetGame() {

        player.x = 200;
        player.y = 450;

        bullets = [];
        scorePopups = [];

        score = 0;

        isGameOver = false;

        parry.active = false;
        parry.cooldown = false;
        parry.rewarded = false;

        parry.timer = 0;
        parry.cdTimer = 0;

        parry.combo = 0;
        parry.comboTimer = 0;

        startButton.style.display = "none";

        update();
    }


    // =========================
    // 게임 업데이트
    // =========================

    function update() {

        if (isGameOver || !isGameStarted) return;

        score++;


        // 패링 지속시간
        if (parry.active) {

            parry.timer--;

            if (parry.timer <= 0) {
                parry.active = false;
            }
        }


        // 패링 쿨다운
        if (parry.cooldown) {

            parry.cdTimer--;

            if (parry.cdTimer <= 0) {
                parry.cooldown = false;
            }
        }


        // 콤보 제한시간
        if (parry.comboTimer > 0) {

            parry.comboTimer--;

            if (parry.comboTimer <= 0) {
                parry.combo = 0;
            }
        }


        // =========================
        // 플레이어 이동
        // =========================

        if (
            (keys["ArrowLeft"] || keys["a"]) &&
            player.x > player.radius
        ) {
            player.x -= player.speed;
        }

        if (
            (keys["ArrowRight"] || keys["d"]) &&
            player.x < canvas.width - player.radius
        ) {
            player.x += player.speed;
        }

        if (
            (keys["ArrowUp"] || keys["w"]) &&
            player.y > player.radius
        ) {
            player.y -= player.speed;
        }

        if (
            (keys["ArrowDown"] || keys["s"]) &&
            player.y < canvas.height - player.radius
        ) {
            player.y += player.speed;
        }


        // =========================
        // 탄막 이동 + 충돌
        // =========================

        for (let i = bullets.length - 1; i >= 0; i--) {

            const bullet = bullets[i];

            bullet.y += bullet.speed;


            const dx = player.x - bullet.x;
            const dy = player.y - bullet.y;

            const distance = Math.sqrt(dx * dx + dy * dy);


            // 패링 성공
            if (
                parry.active &&
                distance < parry.radius + bullet.radius
            ) {

                bullets.splice(i, 1);


                // 한 번의 패링에서 보상은 한 번만
                if (!parry.rewarded) {

                    parry.rewarded = true;

                    if (parry.combo < 5) {
                        parry.combo++;
                    }

                    parry.comboTimer = parry.maxComboTimer;

                    const points = 200 * parry.combo;

                    score += points;


                    scorePopups.push({

                        x: bullet.x,
                        y: bullet.y,

                        text:
                            `+${points} (${parry.combo} STACK!)`,

                        life: 30
                    });
                }

                continue;
            }


            // 플레이어와 충돌
            if (
                distance <
                player.radius + bullet.radius
            ) {

                isGameOver = true;
            }
        }


        // 화면 아래로 지나간 탄 제거
        bullets = bullets.filter(function (bullet) {

            return bullet.y < canvas.height;

        });


        // =========================
        // 점수 팝업
        // =========================

        for (
            let i = scorePopups.length - 1;
            i >= 0;
            i--
        ) {

            scorePopups[i].y -= 1;
            scorePopups[i].life--;

            if (scorePopups[i].life <= 0) {

                scorePopups.splice(i, 1);
            }
        }


        draw();


        if (!isGameOver) {

            requestAnimationFrame(update);

        } else {

            drawGameOver();
        }
    }


    // =========================
    // 게임 화면 그리기
    // =========================

    function draw() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // 패링 쉴드
        if (parry.active) {

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                parry.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "rgba(180, 0, 255, 0.4)";

            ctx.fill();

            ctx.strokeStyle =
                "#d8b4fe";

            ctx.lineWidth = 2;

            ctx.stroke();
        }


        // 플레이어
        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#00ffff";

        ctx.fill();


        // 탄막
        ctx.fillStyle = "#ff4444";

        bullets.forEach(function (bullet) {

            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y,
                bullet.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        });


        // 점수 팝업
        scorePopups.forEach(function (popup) {

            ctx.fillStyle = "#ffff00";

            ctx.font =
                "bold 13px sans-serif";

            ctx.fillText(
                popup.text,
                popup.x - 30,
                popup.y
            );
        });


        // 점수
        ctx.fillStyle = "#ffffff";

        ctx.font =
            "16px monospace";

        ctx.fillText(
            "SCORE: " + score,
            15,
            30
        );


        // 패링 상태
        if (parry.cooldown) {

            ctx.fillStyle = "#ff6666";

            ctx.fillText(
                "PARRY: RECHARGING...",
                15,
                55
            );

        } else {

            ctx.fillStyle = "#00ffcc";

            ctx.fillText(
                "PARRY: READY (Shift/Z)",
                15,
                55
            );
        }


        // 콤보 UI
        if (parry.combo > 0) {

            ctx.fillStyle = "#ff00ff";

            ctx.font =
                "bold 14px monospace";

            ctx.fillText(
                `COMBO: ${parry.combo}/5 STACK`,
                15,
                80
            );


            const barWidth =
                (parry.comboTimer /
                    parry.maxComboTimer) *
                100;


            ctx.fillStyle = "#ff00ff";

            ctx.fillRect(
                15,
                88,
                barWidth,
                4
            );
        }
    }


    // =========================
    // 게임 오버
    // =========================

    function drawGameOver() {

        ctx.fillStyle =
            "rgba(0, 0, 0, 0.75)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle = "#ff4444";

        ctx.font =
            "bold 28px sans-serif";

        ctx.textAlign = "center";

        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            220
        );


        ctx.fillStyle = "#ffffff";

        ctx.font =
            "18px sans-serif";

        ctx.fillText(
            "최종 점수: " + score,
            canvas.width / 2,
            260
        );


        ctx.font =
            "14px sans-serif";

        ctx.fillStyle = "#aaa";

        ctx.fillText(
            "스페이스바를 누르면 재시작합니다",
            canvas.width / 2,
            300
        );


        ctx.textAlign = "left";
    }


    // =========================
    // 탄막 생성
    // =========================

    setInterval(
        spawnBullet,
        100
    );


    // =========================
    // 처음에는 게임을 시작하지 않음
    // =========================

    draw();

</script>

</body>
</html>
